{% assign disqus_shortname = site.comments.disqus.shortname | default: '' | strip %}
{% if disqus_shortname != '' %}
  <script>
    var disqus_config = function () {
      this.page.url = {{ page.url | absolute_url | jsonify }};
      this.page.identifier = {{ page.comment_path | default: page.id | default: page.url | jsonify }};
      this.page.title = {{ page.title | jsonify }};
      this.language = 'en';
    };
    (function () {
      var d = document, s = d.createElement('script');
      s.src = {{ disqus_shortname | prepend: 'https://' | append: '.disqus.com/embed.js' | jsonify }};
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    })();
  </script>
  <noscript>댓글을 보려면 자바스크립트를 활성화해 주세요. <a href="https://disqus.com/?ref_noscript" rel="nofollow">Disqus 댓글</a></noscript>
{% endif %}
