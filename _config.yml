# Minimal Mistakes — upstream theme files are vendored in this repository.
minimal_mistakes_skin: default
locale: ko-KR
lang: ko-KR
timezone: Asia/Seoul
title: CodeBlue
title_separator: "|"
name: CodeBlue
description: Security Blog
url: https://codeblue0.github.io
baseurl: ""
repository: CodeBlue0/codeblue0.github.io
words_per_minute: 200
breadcrumbs: true
search: true
search_full_content: true
search_provider: lunr
lunr:
  search_within_pages: true
author:
  name: CodeBlue
  avatar: /assets/images/avatar.jpg
  bio: Security Blog
  location: Seoul, South Korea
  links:
    - label: piri007@korea.ac.kr
      icon: fas fa-fw fa-envelope
      url: mailto:piri007@korea.ac.kr
    - label: Website
      icon: fas fa-fw fa-link
      url: https://codeblue0.github.io/
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/CodeBlue0
footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/CodeBlue0
comments:
  provider: disqus
  disqus:
    shortname: codeblue
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
excerpt_separator: <!--more-->
paginate: 15
paginate_path: /page:num/
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
include:
  - _pages
exclude:
  - vendor
  - services
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - licenses
  - THEME.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      toc_icon: bookmark
      comments: true
      share: true
      related: true
      toc: true
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jemoji
